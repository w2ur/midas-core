name: tests
on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml, so a red suite blocks a tag from publishing.
  workflow_call:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # requirements.txt is resolved for 3.12 (see its header). On 3.14 two of
        # its pins cannot install: numpy 2.2.6 has no cp314 wheel and pandas
        # requires numpy>=2.3.3 there, and coincurve 21.0.0 has neither a cp314
        # wheel nor a buildable sdist (ccxt only needs it up to 3.13). So 3.14
        # resolves requirements.in held to every other lock pin as a
        # constraint: the same versions, numpy aside, not a fresh resolution.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            grep -v '^numpy==' requirements.txt > "$RUNNER_TEMP/constraints.txt"
            pip install -r requirements.in setuptools -c "$RUNNER_TEMP/constraints.txt"
          else
            pip install -r requirements.txt
          fi
          pip install -e .
      - name: Configure git
        # Some tests drive real git repos (the watcher push-race rebase-retry).
        # A clean runner has no global identity and defaults new repos to
        # 'master'; the suite assumes 'main' + an identity, like a dev machine.
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@midas.local"
          git config --global user.name "Midas CI"
      - name: Run test suite (isolated core manifest)
        env:
          MIDAS_DATA_DIR: ${{ github.workspace }}/examples/demo-desk
        run: pytest -q

  # The pytest job installs the checkout editable, which hides a wheel that
  # cannot run on its own. This one builds the wheel, installs it alone in a
  # fresh venv (its declared dependencies, never requirements.txt) and runs
  # the README quickstart from outside the checkout. Through workflow_call it
  # also gates publish.yml, so a wheel that cannot reach a fill never ships.
  wheel-quickstart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install the wheel alone in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: README quickstart against the installed wheel
        run: bash .github/quickstart-smoke.sh "$RUNNER_TEMP/clean"
